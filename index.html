<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Fasilitator P4GN BNNP Kalbar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f3f6fb;}
.header {background:linear-gradient(135deg,#003366,#0b5cab);color:white;padding:16px;text-align:center}
.container{max-width:1100px;margin:auto;padding:16px}

.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{padding:10px 14px;border-radius:10px;background:#e5e7eb;cursor:pointer}
.tab.active{background:#0b5cab;color:white}

.section{display:none}
.section.active{display:block}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:white;padding:14px;border-radius:12px}

#map{height:70vh;border-radius:12px}

input,select{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%}
.filter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
</style>
</head>

<body>

<div class="header">
<h2>Dashboard Fasilitator P4GN BNNP Kalbar</h2>
</div>

<div class="container">

<div class="tabs">
<div class="tab active" onclick="showTab('data')">Data Tabel</div>
<div class="tab" onclick="showTab('map')">Berbasis Peta</div>
</div>

<div class="filter">
<input id="search" placeholder="Cari data...">
<select id="kab"></select>
<select id="kec"></select>
</div>

<div id="data" class="section active">
<div id="cards" class="cards"></div>
</div>

<div id="map" class="section"></div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRPyuoCrNpaEwPjcRJVIznXvqZDPE3jtl66VlIUy10slnRIxO_gyKN4HCVKAY1p_mFAhgtv_t0XTJdJ/pub?gid=362240994&single=true&output=csv";

let data = [];
let map, markers=[];

fetch(CSV_URL)
.then(res=>res.text())
.then(csv=>{
const rows = csv.split("\n").slice(1);

data = rows.map(r=>{
let c=r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
return {
kab:c[0], kec:c[1], desa:c[2], alamat:c[3], maps:c[4],
kades:c[5], hpKades:c[6], waKades:c[7],
pic:c[8], hpPic:c[9], waPic:c[10],
sup:c[11], hpSup:c[12], waSup:c[13],
ket:c[14],
lat:parseFloat(c[15]), lng:parseFloat(c[16])
};
});

initFilter();
render();
initMap();
});

function initFilter(){
let kabSet=[...new Set(data.map(d=>d.kab))];
document.getElementById("kab").innerHTML="<option value=''>Kabupaten</option>"+kabSet.map(k=>`<option>${k}</option>`).join("");

let kecSet=[...new Set(data.map(d=>d.kec))];
document.getElementById("kec").innerHTML="<option value=''>Kecamatan</option>"+kecSet.map(k=>`<option>${k}</option>`).join("");
}

function render(){
let q=document.getElementById("search").value.toLowerCase();
let kab=document.getElementById("kab").value;
let kec=document.getElementById("kec").value;

let filtered=data.filter(d=>{
return (!kab||d.kab==kab)&&(!kec||d.kec==kec)&&
(JSON.stringify(d).toLowerCase().includes(q));
});

renderCards(filtered);
renderMap(filtered);
}

function renderCards(arr){
let html="";
arr.forEach(d=>{
html+=`
<div class="card">
<b>${d.desa}</b><br>
${d.kec} - ${d.kab}<br><br>

<b>Fasilitator:</b> ${d.pic||"-"}<br>
<b>Supervisor:</b> ${d.sup||"-"}<br>
<b>Keterangan:</b> ${d.ket||"-"}
</div>`;
});
document.getElementById("cards").innerHTML=html;
}

function initMap(){
map=L.map("map").setView([-0.02,109.34],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function renderMap(arr){
if(!map) return;

markers.forEach(m=>map.removeLayer(m));
markers=[];

arr.forEach(d=>{
if(!d.lat||!d.lng) return;

let m=L.marker([d.lat,d.lng]).addTo(map)
.bindPopup(`<b>${d.desa}</b><br>${d.kec}<br>${d.kab}`);
markers.push(m);
});
}

function showTab(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

document.getElementById(tab).classList.add("active");
event.target.classList.add("active");

setTimeout(()=>{ if(map) map.invalidateSize(); },200);
}

document.getElementById("search").oninput=render;
document.getElementById("kab").onchange=render;
document.getElementById("kec").onchange=render;
</script>

</body>
</html>
